<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0520"/>
      <stop offset="100%" stop-color="#1e1254"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="13" fill="none" stroke="url(#border-grad)" stroke-width="1.5" opacity="0.8"/>

  <!-- C C letters with spacing -->
  <text
    x="21"
    y="43"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="28"
    font-weight="700"
    text-anchor="middle"
    fill="url(#text-grad)"
  >C</text>
  <text
    x="43"
    y="43"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="28"
    font-weight="700"
    text-anchor="middle"
    fill="url(#text-grad)"
  >C</text>
</svg>
